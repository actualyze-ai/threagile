version: 2

project_name: threagile

release:
  github:
    owner: actualyze-ai
    name: threagile

builds:
  - id: threagile
    binary: threagile
    main: ./cmd/threagile
    ldflags:
      - -s -w
      - -X main.buildTimestamp={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: risk_demo
    binary: risk_demo
    main: ./cmd/risk_demo
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE.txt
      - README.md
      - report/template/background.pdf
      - support/openapi.yaml
      - support/schema.json
      - support/live-templates.txt
      - pkg/types/technologies.yaml
      - server/**/*
      - demo/example/threagile.yaml
      - demo/stub/threagile.yaml

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}.sbom.spdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
